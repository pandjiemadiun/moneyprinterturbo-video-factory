networks:
  mpt-network:
    driver: bridge

services:
  webui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: "moneyprinterturbo-webui"
    ports:
      - "127.0.0.1:8501:8501"
    command: [ "streamlit", "run", "./webui/Main.py", "--server.address=0.0.0.0", "--server.port=8501", "--browser.serverAddress=127.0.0.1", "--server.enableCORS=True", "--browser.gatherUsageStats=False", "--client.toolbarMode=minimal", "--logger.hideWelcomeMessage=True", "--server.showEmailPrompt=False" ]
    volumes:
      - /opt/MoneyPrinterTurbo/config.toml:/MoneyPrinterTurbo/config.toml
      - /opt/MoneyPrinterTurbo/storage:/MoneyPrinterTurbo/storage
    restart: always
    networks:
      - mpt-network
    environment:
      - MPT_API_BASE_URL=http://moneyprinterturbo-api:8080
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: "moneyprinterturbo-api"
    ports:
      - "127.0.0.1:8080:8080"
    command: [ "python3", "main.py" ]
    volumes:
      - /opt/MoneyPrinterTurbo/config.toml:/MoneyPrinterTurbo/config.toml
      - /opt/MoneyPrinterTurbo/storage:/MoneyPrinterTurbo/storage
    restart: always
    networks:
      - mpt-network
